[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotos-flask"
version = "0.1.0"
description = "LotOS UI Flask adapter with Jinja macros and shared contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Lotos Technologies", email = "lotos@lotos.dev" }
]
dependencies = [
  "Flask>=3.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lotos_flask*"]

[tool.setuptools.package-data]
lotos_flask = ["templates/**/*.html"]

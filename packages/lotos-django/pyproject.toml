[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotos-django"
version = "0.1.0"
description = "LotOS UI Django adapter with template tags and shared contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Lotos Technologies", email = "lotos@lotos.dev" }
]
dependencies = [
  "Django>=5.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lotos_django*"]

[tool.setuptools.package-data]
lotos_django = ["templates/**/*.html"]

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section style="background:#0f172a;color:#e2e8f0;padding:24px;border-radius:24px;border:1px solid #1e293b;font-family:Segoe UI, sans-serif;">
  <div style="display:grid;gap:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div>
        <p style="margin:0;color:#38bdf8;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.1em;">LotOS Spring</p>
        <h1 style="margin:6px 0 0;font-size:30px;">Ops Console</h1>
      </div>
      <span th:replace="~{lotos-ui/components :: lotosBadge(label='Production track', variant='success')}"></span>
    </div>

    <article th:replace="~{lotos-ui/components :: lotosCard(title='Queue health', body='<p style=&quot;margin:0;color:#94a3b8;&quot;>Stable response windows across the last 12 hours.</p>', footer=null)}"></article>

    <form th:replace="~{lotos-ui/components :: lotosForm(title='Dispatch approval', description='Review critical queue changes before release.', action='#', method='post', submitLabel='Approve batch', body=${'<div style=&quot;display:grid;gap:12px;&quot;><label style=&quot;display:grid;gap:8px;&quot;><span style=&quot;font-size:13px;font-weight:700;&quot;>Owner</span><input type=&quot;text&quot; placeholder=&quot;Mia Solis&quot; style=&quot;padding:10px 12px;border-radius:12px;border:1px solid #334155;background:#020617;color:#e2e8f0;&quot;/><small style=&quot;color:#94a3b8;&quot;>Use the current incident owner</small></label></div>'})}"></form>

    <div th:replace="~{lotos-ui/components :: lotosTable(caption='Queue summary', columns=${queueColumns}, rows=${queueRows}, emptyState='No queued work')}"></div>

    <section th:replace="~{lotos-ui/components :: lotosModal(title='Escalation notice', description='Customers in tier A will be notified immediately.', body='<p style=&quot;margin:0;color:#cbd5e1;&quot;>Proceed only after owner confirmation.</p>', footer='<button type=&quot;button&quot; style=&quot;padding:10px 14px;border-radius:14px;border:1px solid #38bdf8;background:transparent;color:#38bdf8;font-weight:700;&quot;>Acknowledge</button>')}"></section>
  </div>
</section>
</body>
</html>

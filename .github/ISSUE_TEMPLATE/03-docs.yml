name: Docs issue
description: Report a public docs gap or correction.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report does not include secrets, private URLs, or buyer personal data.
          required: true
        - label: This is not a security vulnerability report.
          required: true
  - type: input
    id: page
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
    validations:
      required: true

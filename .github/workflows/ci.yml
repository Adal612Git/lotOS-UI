name: CI

on:
  push:
    branches:
      - main
      - phase1-stable
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @lotosui/core run build

      - name: Run MCP render demo
        run: node packages/core/examples/mcp-render-demo.mjs

      - name: Typecheck claude-arm
        run: pnpm --filter @lotosui/claude-arm run check-types

      - name: Check component test coverage surface
        run: pnpm --filter @lotosui/claude-arm run coverage:components

      - name: Enforce execution coverage
        run: pnpm --filter @lotosui/claude-arm run test:coverage

      - name: Build claude-arm showcase
        run: pnpm --filter @lotosui/claude-arm run showcase:build

      - name: Check claude-arm visual baselines
        run: pnpm --filter @lotosui/claude-arm run visual:check

      - name: Test cli
        run: pnpm --filter @lotosui/cli run test

      - name: Validate Python runtime adapters
        run: |
          python -m py_compile \
            packages/lotos-django/lotos_django/__init__.py \
            packages/lotos-django/lotos_django/apps.py \
            packages/lotos-django/lotos_django/contracts.py \
            packages/lotos-django/lotos_django/validator.py \
            packages/lotos-django/lotos_django/templatetags/lotos_ui.py \
            packages/lotos-django/examples/views.py \
            packages/lotos-flask/lotos_flask/__init__.py \
            packages/lotos-flask/lotos_flask/contracts.py \
            packages/lotos-flask/lotos_flask/validator.py

      - name: Validate desktop python demo
        run: |
          python -m py_compile apps/desktop-python-demo/app.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("apps/desktop-python-demo/app.py")
          spec = importlib.util.spec_from_file_location("lotos_desktop_demo", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          state = module.build_demo_state()
          assert state["queue_total"] >= 1
          assert state["high_priority"] >= 1
          print(state["title"])
          PY

      - name: Build desktop Java demo
        working-directory: apps/desktop-java-demo
        run: |
          javac App.java
          jar --create --file LotosDesktopJavaDemo.jar --main-class App App.class

      - name: Build desktop Rust demo
        working-directory: apps/desktop-rust-demo
        run: cargo build --release

      - name: Build Go runtime adapter
        working-directory: packages/lotos-go
        run: go build ./...

      - name: Build .NET runtime adapter
        run: dotnet build packages/lotos-dotnet/LotosUi.Dotnet.csproj

      - name: Verify contracts
        run: pnpm run verify:100

      - name: Verify runtime adapter surface
        run: pnpm run verify:runtimes

      - name: Verify runtime example coverage
        run: pnpm run verify:runtime-examples

      - name: Verify private pro surface
        run: pnpm --filter @lotosui/pro-private run verify

  desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build .NET desktop demo
        run: dotnet build apps/desktop-dotnet-demo/LotosDesktopDemo.csproj

      - name: Validate Python desktop demo
        run: |
          python -m py_compile apps/desktop-python-demo/app.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("apps/desktop-python-demo/app.py")
          spec = importlib.util.spec_from_file_location("lotos_desktop_demo", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          state = module.build_demo_state()
          assert state["queue_total"] >= 1
          print(state["title"])
          PY

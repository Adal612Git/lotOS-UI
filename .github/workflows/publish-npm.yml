name: Publish NPM Packages

on:
  workflow_dispatch:
    inputs:
      publish_core:
        description: "Publish @lotosui/core"
        type: boolean
        default: true
      publish_sentinel:
        description: "Publish @lotosui/sentinel"
        type: boolean
        default: true
      publish_cli:
        description: "Publish @lotosui/cli"
        type: boolean
        default: true
      publish_web_components:
        description: "Publish @lotosui/web-components"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Missing NPM_PUBLISH_TOKEN secret"
            exit 1
          fi
          TOKEN_LEN=${#NPM_TOKEN}
          echo "NPM_TOKEN length: $TOKEN_LEN"
          TOKEN_SHA=$(printf '%s' "$NPM_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "NPM_TOKEN sha256: $TOKEN_SHA"
          if ! [[ "$NPM_TOKEN" =~ ^npm_[A-Za-z0-9]{20,}$ ]]; then
            echo "NPM_TOKEN format looks invalid. Paste the full token value (not masked with dots)."
            exit 1
          fi
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > ~/.npmrc
          npm whoami || echo "npm whoami failed; continuing to publish for direct verification"

      - name: Build publishable packages
        run: |
          rm -rf packages/core/dist packages/sentinel/dist packages/cli/dist packages/web-components/dist
          rm -f packages/core/tsconfig.build.tsbuildinfo packages/sentinel/tsconfig.build.tsbuildinfo packages/cli/tsconfig.build.tsbuildinfo packages/web-components/tsconfig.build.tsbuildinfo
          pnpm --filter @lotosui/core run build
          pnpm --filter @lotosui/sentinel run build
          pnpm --filter @lotosui/cli run build
          pnpm --filter @lotosui/web-components run build

      - name: Publish selected packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_USERCONFIG: /home/runner/.npmrc
          PUBLISH_CORE: ${{ inputs.publish_core }}
          PUBLISH_SENTINEL: ${{ inputs.publish_sentinel }}
          PUBLISH_CLI: ${{ inputs.publish_cli }}
          PUBLISH_WEB_COMPONENTS: ${{ inputs.publish_web_components }}
        run: node .github/scripts/publish-npm.mjs
